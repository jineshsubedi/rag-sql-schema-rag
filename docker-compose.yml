services:
  # ---------------------------------------------------------------------------
  # 1. Ollama LLM & Embedding Service
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: schema_rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - rag-network
    # Note: On first startup, pull the required models via:
    # docker exec -it schema_rag_ollama ollama pull qwen2.5-coder:7b
    # docker exec -it schema_rag_ollama ollama pull nomic-embed-text

  # ---------------------------------------------------------------------------
  # 2. Qdrant Vector Store
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: schema_rag_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - rag-network

  # ---------------------------------------------------------------------------
  # 3. FastAPI & LangChain Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schema_rag_backend
    network_mode: host
    environment:
      # Connection to local PostgreSQL instance on host (user: tuf, db: tuf with schema: ecommerce)
      - DATABASE_URL=postgresql://tuf:tuf@127.0.0.1:5432/tuf
      - TARGET_SCHEMA=ecommerce,public
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - QDRANT_URL=http://127.0.0.1:6333
      - QDRANT_COLLECTION_NAME=schema_rag
      - OLLAMA_LLM_MODEL=qwen2.5-coder:7b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - DB_MIN_CONNECTIONS=1
      - DB_MAX_CONNECTIONS=10
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Streamlit Frontend Service
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schema_rag_frontend
    network_mode: host
    environment:
      # URL to communicate with the FastAPI backend on the host
      - BACKEND_URL=http://127.0.0.1:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  rag-network:
    driver: bridge
